name: Selftest

# 脚手架仓库自身的回归测试：Python 离线测试 + 生成物守卫冒烟。
# 与生成项目的 .github/workflows/ci.yml 职责不同——那份跑的是新项目的 Java/前端门禁。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python · 离线回归测试（${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # 只用标准库：不装依赖、不访问网络、不启动 Docker / Maven / npm。
      - name: 跑离线回归测试
        run: python -m unittest discover -s tests -v

  consistency:
    name: 维护 · 版本表与 skill 清单一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 只读、离线：比对 TECH-STACK 版本表 / 四张 skill 清单表与模板、拉取脚本，
      # 并检查架构图的 .dot / .svg / 文档引用与图内事实。
      - name: 跑一致性检查
        run: python scripts/check_consistency.py

  smoke:
    name: 生成物 · 四条守卫冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 生成全开关项目并跑守卫
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/scaffold-smoke"
          HEAD_SHA="$(git rev-parse HEAD)"
          rm -rf "$OUT"

          # 先走 AI 的正式入口：dry-run JSON 预览必须可解析，且不落盘。
          python scripts/scaffold.py --name ci-smoke --package com.example.cismoke \
            --out "$OUT" --with-deploy --with-ops --with-testing --dry-run --json \
            > "$RUNNER_TEMP/plan.json"
          python - "$RUNNER_TEMP/plan.json" "$HEAD_SHA" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          assert plan["dry_run"] is True
          assert plan["file_count"] == len(plan["files"]) == len(set(plan["files"]))
          assert plan["files"].count(".scaffold.json") == 1

          record = plan["scaffold_record"]["content"]
          assert record["schema_version"] == 1
          assert record["generator"]["name"] == "project-scaffold"
          assert record["generator"]["source"] == {
              "commit": sys.argv[2], "dirty": False, "status": "git",
          }
          assert record["project"]["name"] == "ci-smoke"
          print(f"预览 {plan['file_count']} 个文件 / 占位")
          PY
          test ! -e "$OUT"

          # 与预览完全相同的参数正式生成。
          python scripts/scaffold.py --name ci-smoke --package com.example.cismoke \
            --out "$OUT" --with-deploy --with-ops --with-testing

          # 预览里的记录必须与真实落盘一致。
          python - "$OUT/.scaffold.json" "$RUNNER_TEMP/plan.json" <<'PY'
          import json
          import sys

          actual = json.load(open(sys.argv[1], encoding="utf-8"))
          plan = json.load(open(sys.argv[2], encoding="utf-8"))
          assert actual == plan["scaffold_record"]["content"]
          PY

          # 链接守卫只扫已跟踪文件：必须先初始化并暂存。
          cd "$OUT"
          git init -q
          git add -A
          bash scripts/check-doc-links.sh
          bash scripts/check-todo-archive.sh
          bash scripts/check-module-tests.sh
          # 无 tag 时版本守卫按设计跳过，返回 0。
          bash scripts/check-version.sh
