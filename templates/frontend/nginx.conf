server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不把 nginx 版本写进响应头。
    server_tokens off;

    # ⚠️ 安全头只能放在 server 层。nginx 的规则是：某个 location 里只要写了任何 add_header，
    #    server 层的 add_header 对该 location 就**全部失效**。谁要在 location 里加头，先看这条。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 默认不开的两条，按实际部署决定：
    #   CSP 会拦掉 index.html 里的内联脚本（例如首屏防闪烁），要先梳理脚本来源再开；
    #   HTTPS 在宿主层终止，容器内看到的永远是 http，HSTS 应加在宿主配置里。
    # add_header Content-Security-Policy "default-src 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # SPA 回退：未知路径都回 index.html，交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物文件名带内容哈希，可以放心长期缓存。
    # ⚠️ 缺失时必须是真 404，不能回退到 index.html：发版后旧页面请求已删除的哈希文件，
    #    若拿到 HTML，浏览器会报「意外的 <」且很难排查。
    # 注意：Vite 默认产物目录是 assets；改了 build.assetsDir 要同步这里。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # 入口文件永远要最新：no-cache 仍保留 ETag，浏览器每次只做廉价的 304 校验。
    location = /index.html {
        expires -1;
    }

    # 后端与前端同域部署时，由宿主反代把 /api/ 指到 server 容器；
    # 这里保留一段示例，用于「web 容器自己兼任反代」的形态。
    location /api/ {
        proxy_pass http://${PROJECT_NAME}-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        # 用 default_type 而不是 add_header：add_header 是追加，会产生两个 Content-Type。
        default_type text/plain;
        return 200 'ok';
    }
}
